<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>外食PFC v6</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#111827;--good:#087f5b;--soft:#eef2ff}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:var(--bg);color:var(--ink)}
header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:14px 16px}
.headerin{max-width:1000px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:20px;margin:0}.sub{font-size:11px;color:var(--muted);margin-top:3px}
main{max-width:1000px;margin:auto;padding:14px 14px 90px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
button,input,select{font:inherit}.tab,.btn{border:0;border-radius:11px;padding:11px 12px;cursor:pointer}.tab{background:#e5e7eb}.tab.active,.btn.primary{background:var(--accent);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:12px;box-shadow:0 2px 12px #11182708}
h2,h3{margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
label{display:block;font-size:11px;color:var(--muted);margin:0 0 4px}input,select{width:100%;border:1px solid #d1d5db;border-radius:10px;padding:10px;background:#fff}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.btn{width:auto;background:#e5e7eb;color:var(--ink)}.btn.primary{font-weight:700}.btn.good{background:#e7f5ef;color:#066a4c}
.chips{display:flex;gap:7px;overflow:auto;padding-bottom:3px}.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 10px;font-size:12px;cursor:pointer}
.summary{display:flex;justify-content:space-between;align-items:center;gap:10px}.count{font-size:12px;color:var(--muted)}
.results,.stores{display:grid;gap:9px}.item,.store{border:1px solid var(--line);border-radius:14px;padding:13px;background:#fff}.top{display:flex;justify-content:space-between;gap:10px}.name{font-weight:750}.chain{font-size:12px;color:var(--muted);margin-top:2px}
.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}.metricbox{background:#f8fafc;border-radius:9px;padding:7px;text-align:center}.metricbox b{display:block;font-size:14px}.metricbox span{font-size:10px;color:var(--muted)}
.badge{font-size:10px;border-radius:999px;padding:4px 7px;background:#e7f5ef;color:#066a4c;height:max-content}.small{font-size:11px;color:var(--muted);margin-top:8px}.empty,.notice{padding:14px;border-radius:12px;background:#f8fafc;color:var(--muted);font-size:12px}
.notice{background:#fff8e6;color:#73510d}.hidden{display:none!important}
.store .distance{font-size:18px;font-weight:750}.storeActions{display:flex;gap:7px;margin-top:10px}.storeActions button,.storeActions a{flex:1;text-align:center;text-decoration:none;border-radius:9px;padding:9px;font-size:12px;border:0;background:#eef2ff;color:#263c88}
.status{font-size:12px;margin-top:10px}.ok{color:var(--good)}.error{color:#b42318}
.big{font-size:26px;font-weight:800}.cutgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.cutbox{background:#f8fafc;padding:12px;border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:12px;margin-top:12px}th,td{padding:8px;border-bottom:1px solid var(--line);text-align:right}th:first-child,td:first-child{text-align:left}
footer{font-size:10px;color:var(--muted);text-align:center;padding:15px}
@media(max-width:720px){.grid{grid-template-columns:repeat(2,1fr)}.grid3{grid-template-columns:1fr 1fr}.metrics{grid-template-columns:repeat(3,1fr)}.cutgrid{grid-template-columns:1fr}.headerin{align-items:flex-start}.tabs{position:sticky;top:68px;z-index:9;background:var(--bg);padding:5px 0}}
</style>
</head>
<body>
<header><div class="headerin"><div><h1>外食PFC <small style="font-size:11px">v6 TEST</small></h1><div class="sub">公式栄養データ 193件 / 10チェーン</div></div><div class="badge">公式値DB</div></div></header>
<main>
<div class="tabs">
<button class="tab active" data-tab="search">メニュー</button>
<button class="tab" data-tab="stores">近くの店舗</button>
<button class="tab" data-tab="cut">減量予測</button>
</div>

<section id="search">
<div class="card">
<div class="chips">
<button class="chip" data-preset="lean">700 kcal以下・P30+</button>
<button class="chip" data-preset="highp">P40g以上</button>
<button class="chip" data-preset="lowfat">脂質20g以下</button>
<button class="chip" data-preset="salt">食塩3g以下</button>
</div>
<div class="grid" style="margin-top:12px">
<div><label>メニュー名</label><input id="q" placeholder="例：チキン"></div>
<div><label>チェーン</label><select id="chain"><option value="">すべて</option></select></div>
<div><label>最大 kcal</label><input id="kcal" type="number" inputmode="decimal" placeholder="700"></div>
<div><label>最低 P (g)</label><input id="p" type="number" inputmode="decimal" placeholder="30"></div>
<div><label>最大 F (g)</label><input id="f" type="number" inputmode="decimal" placeholder="任意"></div>
<div><label>最大 C (g)</label><input id="c" type="number" inputmode="decimal" placeholder="任意"></div>
<div><label>最大 食塩 (g)</label><input id="salt" type="number" inputmode="decimal" placeholder="任意"></div>
<div><label>並び順</label><select id="sort"><option value="ratio">P効率が高い順</option><option value="p">Pが多い順</option><option value="kcal">kcalが低い順</option><option value="fat">脂質が低い順</option></select></div>
</div>
<div class="actions"><button class="btn primary" id="searchBtn">検索</button><button class="btn" id="resetBtn">条件をリセット</button></div>
</div>
<div class="card"><div class="summary"><h3>検索結果</h3><div id="count" class="count"></div></div><div id="results" class="results"></div></div>
</section>

<section id="stores" class="hidden">
<div class="card">
<h3>GPS周辺店舗検索</h3>
<div class="grid3">
<div><label>検索半径</label><select id="radius"><option value="1000">1 km</option><option value="3000" selected>3 km</option><option value="5000">5 km</option><option value="10000">10 km</option></select></div>
<div><label>表示件数</label><select id="storeLimit"><option>10</option><option selected>20</option><option>40</option></select></div>
<div><label>対象</label><select id="storeChain"><option value="">収録チェーンすべて</option></select></div>
</div>
<div class="actions"><button class="btn primary" id="locateBtn">現在地から店舗を探す</button></div>
<div id="gpsStatus" class="status">HTTPSまたはlocalhostで位置情報を許可してください。</div>
<div id="storeResults" class="stores" style="margin-top:12px"></div>
<div class="small">テスト版の周辺検索はOpenStreetMap/Overpassの公開データを使用します。店舗の欠落・閉店情報の遅れがあり得ます。公開APIは小規模テスト用途とし、本番公開時は店舗API/地図APIへ差し替える設計です。</div>
</div>
</section>

<section id="cut" class="hidden">
<div class="card"><h3>減量シミュレーター</h3>
<div class="grid">
<div><label>性別</label><select id="sex"><option value="male">男性</option><option value="female">女性</option></select></div>
<div><label>年齢</label><input id="age" type="number" placeholder="36"></div>
<div><label>身長 cm</label><input id="height" type="number" placeholder="175"></div>
<div><label>体重 kg</label><input id="weight" type="number" placeholder="75"></div>
<div><label>活動量</label><select id="activity"><option value="1.2">ほぼ座位</option><option value="1.375">軽い運動</option><option value="1.55" selected>中等度</option><option value="1.725">高い</option><option value="1.9">非常に高い</option></select></div>
<div><label>目標減量 kg</label><input id="target" type="number" placeholder="5"></div>
<div><label>期間 ヶ月</label><input id="months" type="number" value="3"></div>
</div>
<div class="actions"><button class="btn primary" id="calcBtn">計算する</button></div>
<div id="cutResult" style="margin-top:12px"></div>
</div>
</section>
<footer>栄養値は各社公表の標準値。実際の商品にはばらつきがあります。減量予測は単純モデルであり医療判断には使用しないでください。</footer>
</main>

const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const n=(id,fallback)=>{const v=parseFloat($(id).value);return Number.isFinite(v)?v:fallback};

chains.forEach(x=>{["chain","storeChain"].forEach(id=>$(id).insertAdjacentHTML("beforeend",`<option value="${esc(x)}">${esc(x)}</option>`))});

document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{
 document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active")); b.classList.add("active");
 ["search","stores","cut"].forEach(id=>$(id).classList.toggle("hidden",id!==b.dataset.tab));
});

document.querySelectorAll("[data-preset]").forEach(b=>b.onclick=()=>{
 ["kcal","p","f","c","salt"].forEach(id=>$(id).value="");

 if(b.dataset.preset==="highp")$("p").value=40;

 if(b.dataset.preset==="salt")$("salt").value=3;

});

function search(){
 const q=$("q").value.trim().toLowerCase(), ch=$("chain").value;
 const K=n("kcal",Infinity),P=n("p",0),F=n("f",Infinity),C=n("c",Infinity),S=n("salt",Infinity);
 let arr=data.filter(x=>(!q||x.name.toLowerCase().includes(q))&&(!ch||x.chain===ch)&&x.kcal<=K&&x.p>=P&&x.f<=F&&x.c<=C&&x.salt<=S);
 const so=$("sort").value;
 arr.sort((a,b)=>so==="kcal"?a.kcal-b.kcal:so==="p"?b.p-a.p:so==="fat"?a.f-b.f:(b.p/b.kcal)-(a.p/a.kcal));
 $("count").textContent=`${arr.length}件 / ${data.length}件`;
 $("results").innerHTML=arr.length?arr.slice(0,200).map(x=>`
 <div class="item"><div class="top"><div><div class="name">${esc(x.name)}</div><div class="chain">${esc(x.chain)}</div></div><span class="badge">公式値</span></div>
 <div class="metrics"><div class="metricbox"><b>${x.kcal}</b><span>kcal</span></div><div class="metricbox"><b>${x.p}g</b><span>Protein</span></div><div class="metricbox"><b>${x.f}g</b><span>Fat</span></div><div class="metricbox"><b>${x.c}g</b><span>Carb</span></div><div class="metricbox"><b>${x.salt}g</b><span>食塩</span></div></div>
 <div class="small">P効率 ${(x.p/x.kcal*100).toFixed(1)} g/100kcal ・ 確認日 ${esc(x.checked)}</div></div>`).join(""):`<div class="empty">条件に合う収録メニューはありません。</div>`;
}

const chainAliases={
"マクドナルド":["マクドナルド","McDonald's","McDonald’s"],
"松屋":["松屋"],
"やよい軒":["やよい軒"],
"大戸屋":["大戸屋"],
"モスバーガー":["モスバーガー","MOS BURGER","MOS Burger"],
"ケンタッキーフライドチキン":["ケンタッキー","KFC","Kentucky Fried Chicken"],
"CoCo壱番屋":["CoCo壱番屋","CoCo Ichibanya","CoCo壱"],
"ジョイフル":["ジョイフル","Joyfull"],
"びっくりドンキー":["びっくりドンキー"],
"バーガーキング":["バーガーキング","Burger King"]
};
function distKm(a,b,c,d){const R=6371,toR=x=>x*Math.PI/180,dp=toR(c-a),dl=toR(d-b),z=Math.sin(dp/2)**2+Math.cos(toR(a))*Math.cos(toR(c))*Math.sin(dl/2)**2;return 2*R*Math.asin(Math.sqrt(z))}
function matchChain(name,brand){
 const t=((name||"")+" "+(brand||"")).toLowerCase();
 for(const [chain,aliases] of Object.entries(chainAliases)) if(aliases.some(a=>t.includes(a.toLowerCase()))) return chain;
 return null;
}
async function overpassNearby(lat,lon,radius){
 const selected=$("storeChain").value;
 const aliases=selected?(chainAliases[selected]||[selected]):Object.values(chainAliases).flat();
 const rx=aliases.map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|");
 const q=`[out:json][timeout:20];(nwr(around:${radius},${lat},${lon})["amenity"~"restaurant|fast_food"]["name"~"${rx}",i];nwr(around:${radius},${lat},${lon})["brand"~"${rx}",i];);out center tags;`;
 const ctrl=new AbortController();const timer=setTimeout(()=>ctrl.abort(),18000);
 try{
  const u="https://overpass-api.de/api/interpreter?data="+encodeURIComponent(q);
  const r=await fetch(u,{signal:ctrl.signal,headers:{"Accept":"application/json"}});
  if(!r.ok) throw new Error("HTTP "+r.status);
  return await r.json();
 } finally {clearTimeout(timer)}
}
$("locateBtn").onclick=()=>{
 if(!navigator.geolocation){$("gpsStatus").innerHTML='<span class="error">このブラウザは位置情報に対応していません。</span>';return}
 $("gpsStatus").textContent="現在地を取得しています…";$("storeResults").innerHTML="";
 navigator.geolocation.getCurrentPosition(async pos=>{
  const lat=pos.coords.latitude,lon=pos.coords.longitude,radius=+$("radius").value;
  $("gpsStatus").innerHTML=`<span class="ok">現在地を取得しました。周辺店舗を検索中…</span>`;
  try{
   const json=await overpassNearby(lat,lon,radius);
   const seen=new Set();let stores=json.elements.map(e=>{
    const la=e.lat??e.center?.lat,lo=e.lon??e.center?.lon;if(la==null||lo==null)return null;
    const name=e.tags?.name||e.tags?.brand||"名称不明",chain=matchChain(name,e.tags?.brand);if(!chain)return null;
    const key=`${chain}|${name}|${la.toFixed(4)}|${lo.toFixed(4)}`;if(seen.has(key))return null;seen.add(key);
    return {name,chain,lat:la,lon:lo,d:distKm(lat,lon,la,lo)};
   }).filter(Boolean).sort((a,b)=>a.d-b.d).slice(0,+$("storeLimit").value);
   $("gpsStatus").innerHTML=`<span class="ok">${stores.length}店舗見つかりました（半径 ${(radius/1000).toFixed(0)}km）。</span>`;
   $("storeResults").innerHTML=stores.length?stores.map(s=>`<div class="store"><div class="top"><div><div class="name">${esc(s.name)}</div><div class="chain">${esc(s.chain)}</div></div><div class="distance">${s.d.toFixed(1)} km</div></div><div class="storeActions"><button onclick="menusFor('${esc(s.chain)}')">この店のPFCを見る</button><a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${s.lat},${s.lon}">地図</a></div></div>`).join(""):`<div class="empty">対象チェーンの店舗が見つかりませんでした。半径を広げるか、OpenStreetMap側に店舗情報が未登録の可能性があります。</div>`;
  }catch(e){$("gpsStatus").innerHTML='<span class="error">周辺店舗APIに接続できませんでした。少し待って再試行してください。</span>'}
 },err=>{$("gpsStatus").innerHTML=`<span class="error">位置情報を取得できませんでした（${esc(err.message)}）。Safari/ブラウザの位置情報許可とHTTPS接続を確認してください。</span>`},{enableHighAccuracy:true,timeout:12000,maximumAge:60000});
};
window.menusFor=ch=>{$("chain").value=ch;document.querySelector('[data-tab="search"]').click();search();window.scrollTo({top:0,behavior:"smooth"})};

$("calcBtn").onclick=()=>{
 const sex=$("sex").value,A=n("age",0),H=n("height",0),W=n("weight",0),T=n("target",0),M=n("months",0),act=n("activity",1.55);
 if(!A||!H||!W||!M){$("cutResult").innerHTML='<div class="notice">年齢・身長・体重・期間を入力してください。</div>';return}
 const bmr=sex==="male"?10*W+6.25*H-5*A+5:10*W+6.25*H-5*A-161,tdee=bmr*act,days=Math.round(M*30.44),need=T?T*7700/days:null;
 const rows=[300,500,750].map(d=>({d,intake:Math.round(tdee-d),kg:d*days/7700}));
 $("cutResult").innerHTML=`<div class="cutgrid"><div class="cutbox"><div class="small">推定BMR</div><div class="big">${Math.round(bmr)}</div><div class="small">kcal/day</div></div><div class="cutbox"><div class="small">推定TDEE</div><div class="big">${Math.round(tdee)}</div><div class="small">kcal/day</div></div><div class="cutbox"><div class="small">期間</div><div class="big">${days}</div><div class="small">日</div></div></div><table><tr><th>赤字/日</th><th>摂取目安</th><th>理論減量</th></tr>${rows.map(r=>`<tr><td>${r.d}</td><td>${r.intake} kcal</td><td>${r.kg.toFixed(1)} kg</td></tr>`).join("")}</table>${need?`<div class="notice">目標 ${T} kg / ${M}ヶ月なら単純計算で約 <b>${Math.round(need)} kcal/day</b> の赤字。実際は代謝適応・体水分・摂取誤差等で変動します。</div>`:""}`;
};
search();
